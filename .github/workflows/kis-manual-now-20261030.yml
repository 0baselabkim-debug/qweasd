name: User manual full market 2026-10-30; automatic schedule disabled
on:
  push:
    branches: [fix/manual-start-20261030]
    paths: [.github/trials/manual-start-20261030.json]
permissions:
  contents: write
  actions: write
concurrency:
  group: kis-validation-auth
  cancel-in-progress: false
  queue: max
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
        with:
          path: launcher
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f36ab970428564e7569ae37d61f2cfa3f644e119
          path: runtime
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: runtime/requirements.txt
      - run: python -m pip install -r requirements.txt pytest==9.1.1
      - name: Disable only the existing 20:30 automatic workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ../launcher/manual_collection/launch.py disable
      - name: Offline existing collector and manual-entry safeguards
        run: python -m pytest -q tests/test_regular_collector.py ../launcher/tests/test_manual_start_now.py
      - name: One user-approved fresh generation with existing shared account lease
        env:
          GH_TOKEN: ${{ github.token }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python ../launcher/manual_collection/launch.py collect
      - name: Preserve only scanned raw and partial results
        if: always()
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python ../launcher/manual_collection/launch.py seal
      - uses: actions/upload-artifact@v4
        id: archive
        if: always() && hashFiles('runtime/data/kis-user-manual-20261030/UPLOAD_ALLOWED') != ''
        with:
          name: kis-user-manual-20261030-${{ github.run_id }}
          path: |
            runtime/data/kis-user-manual-20261030/
            !runtime/data/kis-user-manual-20261030/**/writer.lock
          retention-days: 90
          if-no-files-found: error
      - name: Verify actual stored ZIP before marking complete
        if: steps.archive.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.archive.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.archive.outputs.artifact-digest }}
        run: python ../launcher/manual_collection/launch.py finalize
