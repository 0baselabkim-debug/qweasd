name: Build October 16 briefing JSON
on:
  push:
    branches: [briefing-20261016]
    paths:
      - scripts/export_daily_briefing.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: briefing-20261016
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/export_daily_briefing.py --asof 2026-10-16 --output snapshot/daily_briefing.json
      - name: Commit validated export
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snapshot/daily_briefing.json
          git diff --cached --quiet && exit 0
          git commit -m "Export 2026-10-16 sector briefing JSON"
          git push origin HEAD:briefing-20261016
