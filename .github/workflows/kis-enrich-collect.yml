name: KIS enrichment collection
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'quotes or explicitly approved full historical collection'
        required: true
        default: quotes
        type: choice
        options: [quotes, history]
permissions:
  contents: write
concurrency:
  group: kis-validation-auth
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.6
      - name: Restore only previous checkpoint for this mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="data/kis-${MODE}-20261014"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git merge --no-edit FETCH_HEAD
          fi
      - name: Collect public market data
        env:
          MODE: ${{ inputs.mode }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python .github/scripts/kis_enrich_collect.py --mode "$MODE"
      - name: Preserve data checkpoint on a separate branch
        if: always()
        env:
          MODE: ${{ inputs.mode }}
        run: |
          file="staging/kis_${MODE}_20261014.json.gz"
          if [ ! -f "$file" ]; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="data/kis-${MODE}-20261014"
          git switch -c "$branch"
          git add "$file"
          git commit -m "Preserve public KRX ${MODE} enrichment checkpoint" || true
          git push origin "HEAD:refs/heads/$branch"
      - name: Preserve public response checkpoint even if branch update fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kis-${{ inputs.mode }}-checkpoint
          path: staging/kis_${{ inputs.mode }}_20261014.json.gz
          retention-days: 30
          if-no-files-found: warn
