name: Nov3 regular recovery offline safeguards (NO KIS HTTP)
on:
  push:
    branches: [recovery/regular-20261103]
    paths-ignore: [.github/trials/regular-recovery-20261103.json]
  pull_request:
    paths: ['collector_v1/regular/recovery.py', 'collector_v1/kis_manual.py', 'tests/test_regular_recovery.py', '.github/workflows/kis-regular-recovery*.yml']
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest==9.1.1
      - name: Read-only approved original artifact for offline integrity/reuse tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/0baselabkim-debug/qweasd/actions/artifacts/13230751197/zip > "$RUNNER_TEMP/regular-source.zip"
      - name: Full regression without KIS credentials
        env:
          REGULAR_SOURCE_ZIP: ${{ runner.temp }}/regular-source.zip
        run: python -m pytest -q --junitxml="$RUNNER_TEMP/recovery-full.xml"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regular-recovery-offline-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery-full.xml
          retention-days: 14
          if-no-files-found: error
