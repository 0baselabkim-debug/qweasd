name: Deferred technical reference verification
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [verify, recover]
        default: verify
      symbols:
        type: string
        default: ''
        description: Optional existing codes for bounded targeted recheck
      limit:
        type: number
        default: 3
        description: Bounded manual recovery symbols (maximum 10; same 60 physical requests)
  schedule:
    # Availability checks, NOT a claimed KRX publication/finality time.
    # KST Mon-Sat 08:17; weekdays 11:17, 14:17, 17:17, 20:17.
    - cron: '17 23 * * 0-5'
    - cron: '17 2,5,8,11 * * 1-5'
permissions:
  contents: write
concurrency:
  group: kis-validation-auth
  cancel-in-progress: false
  queue: max
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check official availability and review only pending evidence
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          RECOVERY_SCHEDULE: ${{ github.event.schedule }}
          RECHECK_MODE: ${{ inputs.mode || 'verify' }}
          RECOVERY_SYMBOLS: ${{ inputs.symbols || '' }}
          RECOVERY_LIMIT: ${{ inputs.limit || 3 }}
        run: |
          # Respect the shared KIS token interval if a later real recheck needs it.
          # No token is issued when official reference data is unavailable.
          sleep 65
          if [ "$RECHECK_MODE" = "recover" ]; then
            timeout 600 python scripts/collect_technical.py --mode recover --limit "$RECOVERY_LIMIT" --budget 240 --symbols "$RECOVERY_SYMBOLS"
          else
            timeout 1500 python scripts/collect_technical.py --mode verify --limit 600 --budget 900
            if [ "${{ github.event_name }}" = "schedule" ]; then
              timeout 600 python scripts/collect_technical.py --mode recover --limit 6 --budget 240
            fi
          fi
      - name: Prepare coherent date-specific liquidity evidence
        id: prepare
        run: python scripts/publish_recovery.py
      - name: Preserve evidence and availability records
        id: publish
        env:
          RECOVERY_PREPARE_OK: ${{ steps.prepare.outcome }}
        if: always()
        run: python scripts/commit_recovery.py
      - name: Record actual data outcome independently of Actions success
        if: always()
        env:
          PUBLICATION_RESULT: ${{ steps.publish.outcome }}
        run: |
          python - <<'PY'
          import os
          from scripts.recovery_outcome import emit
          emit(published=os.environ['PUBLICATION_RESULT']=='success',publication_error=os.environ['PUBLICATION_RESULT']!='success')
          PY
          if [ -f reports/recovery-execution/outcome.json ]; then
            git switch -c "evidence/recovery-outcome-$GITHUB_RUN_ID"
            git add reports/recovery-execution
            git commit -m "Record actual recovery and publication outcome"
            git push origin "HEAD:refs/heads/evidence/recovery-outcome-$GITHUB_RUN_ID"
          fi
