name: Deferred technical reference verification
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [verify, recover]
        default: verify
      limit:
        type: number
        default: 3
        description: Bounded manual recovery symbols (maximum 10; same 60 physical requests)
  schedule:
    # Availability checks, NOT a claimed KRX publication/finality time.
    # KST Mon-Sat 08:17; weekdays 11:17, 14:17, 17:17, 20:17.
    - cron: '17 23 * * 0-5'
    - cron: '17 2,5,8,11 * * 1-5'
permissions:
  contents: write
concurrency:
  group: kis-validation-auth
  cancel-in-progress: false
  queue: max
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check official availability and review only pending evidence
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          RECOVERY_SCHEDULE: ${{ github.event.schedule }}
          RECHECK_MODE: ${{ inputs.mode || 'verify' }}
          RECOVERY_LIMIT: ${{ inputs.limit || 3 }}
        run: |
          # Respect the shared KIS token interval if a later real recheck needs it.
          # No token is issued when official reference data is unavailable.
          sleep 65
          if [ "$RECHECK_MODE" = "recover" ]; then
            timeout 600 python scripts/collect_technical.py --mode recover --limit "$RECOVERY_LIMIT" --budget 240
          else
            timeout 1500 python scripts/collect_technical.py --mode verify --limit 600 --budget 900
            if [ "${{ github.event_name }}" = "schedule" ]; then
              timeout 600 python scripts/collect_technical.py --mode recover --limit 4 --budget 240
            fi
          fi
      - name: Prepare coherent date-specific liquidity evidence
        run: python scripts/publish_recovery.py
      - name: Preserve evidence and availability records
        if: always()
        run: python scripts/commit_recovery.py
