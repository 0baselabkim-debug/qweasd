{
  "name": "Export existing market snapshot for local dashboard",
  "on": {
    "push": {
      "paths": [
        ".github/workflows/kis-dashboard-export.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "export": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Read existing verified artifact and matching official masters",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 - <<'PY'\nimport sys,json,zipfile,io,hashlib,gzip,base64\nfrom pathlib import Path\nsys.path.insert(0,'.github/scripts')\nimport kis_missing_analysis as k\nraw=k.get('https://api.github.com/repos/0baselabkim-debug/qweasd/actions/artifacts/11895319157/zip',{'Authorization':'Bearer '+k.SECRETS[0],'Accept':'application/vnd.github+json'})\nassert hashlib.sha256(raw).hexdigest()=='fc83a24d495868e001341974434e5d43d880517649f154ed424fe37a6cc62cb4'\nwith zipfile.ZipFile(io.BytesIO(raw)) as z:state=json.loads(z.read('state.json'))\nlayouts=json.loads(Path('.github/scripts/kis-master-layouts.json').read_text());masters={}\nfor market,l in layouts.items():\n raw=k.get(l['url']);assert hashlib.sha256(raw).hexdigest()==next(x['sha256'] for x in state['master_sources'] if x['market']==market)\n with zipfile.ZipFile(io.BytesIO(raw)) as z:lines=z.read(l['member']).decode('cp949').splitlines()\n for line in lines:\n  width=sum(l['widths']);prefix,tail=line[:-width],line[-width:];code=prefix[:9].strip();fields={};offset=0\n  for key,size in zip(l['columns'],l['widths']):fields[key]=tail[offset:offset+size].strip();offset+=size\n  masters[code]={'industry_large':list(fields.values())[2],'industry_medium':list(fields.values())[3],'industry_small':list(fields.values())[4],'halt':fields.get('거래정지',fields.get('거래정지 여부')),'spac':fields.get('SPAC',fields.get('기업인수목적회사여부'))}\nraw=k.get('https://new.real.download.dws.co.kr/common/master/idxcode.mst.zip')\nwith zipfile.ZipFile(io.BytesIO(raw)) as z:idxraw=z.read('idxcode.mst')\nindices=[]\nfor line in idxraw.splitlines():\n if len(line)>=45:indices.append({'market_div':line[:1].decode('ascii'),'code':line[1:5].decode('ascii'),'name':line[5:45].decode('cp949').strip()})\nuniverse={r['symbol']:r for r in state['universe']}\nrows=[]\nfor code,r in state['successes'].items():\n rows.append({'symbol':code,'name':universe[code]['name'],'market':universe[code]['market'],'listing_date':universe[code]['listing_date'],'trade_date':r['trade_date'],'foreign_net_amount_krw':r['foreign_net_amount_krw'],'foreign_net_quantity_shares':r['foreign_net_quantity_shares'],'source_fields':r['source_fields'],'received_at':r['received_at'],'master':masters[code]})\nbundle={'source_run_id':'38560757360','source_artifact_sha256':'fc83a24d495868e001341974434e5d43d880517649f154ed424fe37a6cc62cb4','trade_date':'20261014','exchange':'KRX','finality':'UNVERIFIED','master_hash_verified':True,'rows':rows,'indices':indices,'original_target':len(universe),'excluded_symbols':list(state['failures'])}\nPath('dashboard-bundle.json').write_text(json.dumps(bundle,ensure_ascii=False))\npacked=base64.b64encode(gzip.compress(json.dumps(bundle,ensure_ascii=False,separators=(',',':')).encode())).decode()\nPath('dashboard-bundle.b64').write_text(packed)\nk.emit('Dashboard bundle manifest',{'rows':len(rows),'indices':len(indices),'chunks':(len(packed)+2799)//2800,'sha256':hashlib.sha256(packed.encode()).hexdigest()})\n\nPY"
        },
        {
          "name": "Export public market data batch 1",
          "run": "python3 - <<'PY'\nimport json\nfrom pathlib import Path\ns=Path('dashboard-bundle.b64').read_text();chunks=[s[i:i+2800] for i in range(0,len(s),2800)]\nassert len(chunks)<=80\nfor i in range(0,min(0+8,len(chunks))):print('::notice title=Dashboard data chunk::'+json.dumps({'part':i,'parts':len(chunks),'data':chunks[i]}))\n\nPY"
        },
        {
          "name": "Export public market data batch 2",
          "run": "python3 - <<'PY'\nimport json\nfrom pathlib import Path\ns=Path('dashboard-bundle.b64').read_text();chunks=[s[i:i+2800] for i in range(0,len(s),2800)]\nassert len(chunks)<=80\nfor i in range(8,min(8+8,len(chunks))):print('::notice title=Dashboard data chunk::'+json.dumps({'part':i,'parts':len(chunks),'data':chunks[i]}))\n\nPY"
        },
