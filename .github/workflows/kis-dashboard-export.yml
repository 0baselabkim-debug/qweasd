        },
        {
          "name": "Export public market data batch 9",
          "run": "python3 - <<'PY'\nimport json\nfrom pathlib import Path\ns=Path('dashboard-bundle.b64').read_text();chunks=[s[i:i+2800] for i in range(0,len(s),2800)]\nassert len(chunks)<=80\nfor i in range(64,min(64+8,len(chunks))):print('::notice title=Dashboard data chunk::'+json.dumps({'part':i,'parts':len(chunks),'data':chunks[i]}))\n\nPY"
        },
        {
          "name": "Export public market data batch 10",
          "run": "python3 - <<'PY'\nimport json\nfrom pathlib import Path\ns=Path('dashboard-bundle.b64').read_text();chunks=[s[i:i+2800] for i in range(0,len(s),2800)]\nassert len(chunks)<=80\nfor i in range(72,min(72+8,len(chunks))):print('::notice title=Dashboard data chunk::'+json.dumps({'part':i,'parts':len(chunks),'data':chunks[i]}))\n\nPY"
        }
      ]
    }
  }
}
