name: KIS three-party native lock proof (zero KIS HTTP)
on:
  workflow_dispatch:
  push:
    branches: [fix/legacy-kis-admission-v1]
  pull_request:
    paths: ['kis_shared/**', 'tests/native_clients_v2/**', 'tests/test_lock_integration_v2.py', '.github/workflows/kis-lock-native-v2.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real child processes and local Git CAS, synthetic HTTP transport only
        run: python -I kis_shared/bundled_proof.py --output "$RUNNER_TEMP/kis-native-v2"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kis-native-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kis-native-v2
          retention-days: 14
          if-no-files-found: error
      - if: always()
        run: echo 'Native proof uses no KIS/OAuth/market calls or credentials. GitHub runtime permission proof and production activation remain separate.' >> "$GITHUB_STEP_SUMMARY"
