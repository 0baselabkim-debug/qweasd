name: Bounded historical KRX recovery (feature only)
on:
  push:
    branches: [feat/decision-evidence-v2]
    paths: ['.github/recovery/historical-krx.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: kis-validation-auth
  cancel-in-progress: false
  queue: max
jobs:
  references:
    if: github.repository == '0baselabkim-debug/qweasd' && github.ref == 'refs/heads/feat/decision-evidence-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      COLLECTION_CLASS: daily_priority
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Restore existing physical journal and cache; no budget reset
        run: |
          git fetch --no-tags origin refs/heads/evidence/decision-price-source
          git restore --source=FETCH_HEAD --worktree -- auxiliary-prices
      - name: Execute explicitly bounded recovery; no KIS credentials
        env:
          GH_TOKEN: ${{ github.token }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python scripts/recover_historical_krx.py .github/recovery/historical-krx.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-krx-recovery-${{ github.run_id }}
          path: auxiliary-prices
          retention-days: 90
          if-no-files-found: error
