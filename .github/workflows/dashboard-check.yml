name: Dashboard deployment check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'screener/**'
      - 'snapshot/**'
      - 'config.toml'
      - '.streamlit/config.toml'
      - 'requirements.txt'
      - 'tests/test_dashboard*.py'
      - 'tests/test_enrichment.py'
      - 'theme_mapping.json'
      - 'account_overrides.json'
      - '.github/workflows/dashboard-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dashboard dependencies
        run: python -m pip install -r requirements.txt pytest==9.1.1
      - name: Test real snapshot, calculations, and UI without API secrets
        run: python -m pytest -q tests/test_dashboard.py tests/test_dashboard_deployment.py tests/test_enrichment.py
      - name: Start and check HTTP server
        shell: bash
        run: |
          python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > /tmp/dashboard-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dashboard-server.log
          exit 1
