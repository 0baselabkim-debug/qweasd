name: Dashboard deployment check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'app_legacy.py'
      - 'tests/test_indicators.py'
      - 'tests/test_exploration_ui.py'
      - 'scripts/diagnose_activity.py'
      - 'scripts/*liquidity.py'
      - 'scripts/*briefing.py'
      - 'scripts/briefing_*.py'
      - 'scripts/publish_snapshot.py'
      - 'tests/test_market_briefing.py'
      - 'scripts/stage_daily_publication.py'
      - 'tests/test_daily_briefing.py'
      - 'tests/fixtures/briefing-20261016.json'
      - '.github/workflows/daily-briefing.yml'
      - 'scripts/market*.py'
      - 'tests/test_liquidity.py'
      - 'tests/test_market*.py'
      - '.github/workflows/liquidity-recovery.yml'
      - 'scripts/kis_public_client.py'
      - 'scripts/corporate_documents.py'
      - 'scripts/replay_corporate_documents.py'
      - 'scripts/publish_corporate.py'
      - 'scripts/repair_corporate_attachments.py'
      - 'scripts/collect_corporate.py'
      - 'screener/**'
      - 'snapshot/**'
      - 'config.toml'
      - '.streamlit/config.toml'
      - 'requirements.txt'
      - 'tests/test_dashboard*.py'
      - 'tests/test_enrichment.py'
      - 'tests/test_daily.py'
      - 'tests/test_corporate.py'
      - 'tests/test_flow_trends.py'
      - 'scripts/collect_daily_snapshot.py'
      - 'scripts/daily_*.py'
      - 'scripts/record_market_run.py'
      - 'tests/test_daily_*.py'
      - 'scripts/prepare_daily_publish.py'
      - '.github/workflows/daily-dashboard.yml'
      - 'theme_mapping.json'
      - 'account_overrides.json'
      - '.github/workflows/dashboard-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dashboard dependencies
        run: python -m pip install -r requirements.txt pytest==9.1.1
      - name: Verify official research evidence offline
        if: github.ref_name == 'research/full-market-transition-20261019'
        shell: bash
        run: |
          set -o pipefail
          python research/risk-performance/verify_official_study.py | tee /tmp/evidence-check.log
      - name: Test real snapshot, calculations, and UI without API secrets
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q | tee /tmp/pytest-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: |
            /tmp/pytest-results.log
            /tmp/evidence-check.log
          retention-days: 30
      - name: Start and check HTTP server
        shell: bash
        run: |
          python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > /tmp/dashboard-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dashboard-server.log
          exit 1
