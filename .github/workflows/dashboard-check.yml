name: Dashboard deployment check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'app_legacy.py'
      - 'eligibility_rules.json'
      - 'tests/test_indicators.py'
      - 'tests/test_exploration_ui.py'
      - 'tests/test_technical.py'
      - 'tests/test_technical_collection.py'
      - 'scripts/technical_batch.py'
      - 'scripts/technical_reference.py'
      - '.github/workflows/technical-verify.yml'
      - 'scripts/technical_acceptance.py'
      - 'scripts/recover_technical.py'
      - 'scripts/kis_public_client.py'
      - 'scripts/publish_recovery.py'
      - 'scripts/corporate_documents.py'
      - 'scripts/repair_corporate_attachments.py'
      - 'tests/test_recovery_operations.py'
      - 'scripts/collect_corporate.py'
      - 'scripts/audit_technical_cache.py'
      - 'scripts/accept_saved_technical.py'
      - 'scripts/collect_technical.py'
      - 'tests/test_journal.py'
      - 'technical_rules.json'
      - 'screener/**'
      - 'snapshot/**'
      - 'config.toml'
      - '.streamlit/config.toml'
      - 'requirements.txt'
      - 'tests/test_dashboard*.py'
      - 'tests/test_enrichment.py'
      - 'tests/test_daily.py'
      - 'tests/test_corporate.py'
      - 'tests/test_flow_trends.py'
      - 'scripts/collect_daily_snapshot.py'
      - 'scripts/prepare_daily_publish.py'
      - '.github/workflows/daily-dashboard.yml'
      - 'theme_mapping.json'
      - 'account_overrides.json'
      - '.github/workflows/dashboard-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dashboard dependencies
        run: python -m pip install -r requirements.txt pytest==9.1.1
      - name: Test real snapshot, calculations, and UI without API secrets
        run: python -m pytest -q tests/test_dashboard.py tests/test_dashboard_deployment.py tests/test_enrichment.py tests/test_daily.py tests/test_flow_trends.py tests/test_corporate.py tests/test_indicators.py tests/test_exploration_ui.py tests/test_technical.py tests/test_journal.py tests/test_technical_collection.py tests/test_recovery_operations.py
      - name: Start and check HTTP server
        shell: bash
        run: |
          python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > /tmp/dashboard-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dashboard-server.log
          exit 1
