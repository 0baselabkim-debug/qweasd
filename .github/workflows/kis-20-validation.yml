{
  "name": "KIS 20-stock KRX validation",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/kis-20-validation.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "kis-validation-auth",
    "cancel-in-progress": false
  },
  "jobs": {
    "validate": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 5,
      "steps": [
        {
          "name": "Read 20 stocks with secrets masked and KRX scope",
          "shell": "bash",
          "env": {
            "KIS_APP_KEY": "${{ secrets.KIS_APP_KEY }}",
            "KIS_APP_SECRET": "${{ secrets.KIS_APP_SECRET }}"
          },
          "run": "python3 - <<'PY'\n\"\"\"Read-only, bounded KIS validation; no order endpoints, persistence or schedules.\"\"\"\nimport datetime as dt\nimport gzip, base64\nimport json\nimport os\nimport re\nimport statistics\nimport sys\nimport time\nimport urllib.error\nimport urllib.parse\nimport urllib.request\nfrom pathlib import Path\n\nBASE='https://openapi.koreainvestment.com:9443'\nDATE='20261013'\nSYMBOLS=[('KOSPI','005930','삼성전자'),('KOSPI','000660','SK하이닉스'),('KOSPI','005380','현대차'),('KOSPI','000270','기아'),('KOSPI','035420','NAVER'),('KOSPI','035720','카카오'),('KOSPI','051910','LG화학'),('KOSPI','006400','삼성SDI'),('KOSPI','005490','POSCO홀딩스'),('KOSPI','105560','KB금융'),('KOSDAQ','247540','에코프로비엠'),('KOSDAQ','086520','에코프로'),('KOSDAQ','196170','알테오젠'),('KOSDAQ','277810','레인보우로보틱스'),('KOSDAQ','058470','리노공업'),('KOSDAQ','214150','클래시스'),('KOSDAQ','145020','휴젤'),('KOSDAQ','041510','에스엠'),('KOSDAQ','035900','JYP Ent.'),('KOSDAQ','263750','펄어비스')]\nSECRETS=[os.environ.get('KIS_APP_KEY',''),os.environ.get('KIS_APP_SECRET','')]\ndef escape(s):return s.replace('%','%25').replace('\\r','%0D').replace('\\n','%0A')\ndef emit(record):\n s=json.dumps(record,ensure_ascii=True,separators=(',',':'))\n for key in SECRETS:\n  if key:s=s.replace(key,'[REDACTED]')\n print('::notice title=KIS twenty-stock evidence::'+escape(s),flush=True)\n with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:f.write('```json\\n'+s+'\\n```\\n')\nfor key in SECRETS:\n if key:print('::add-mask::'+escape(key),flush=True)\nlast_start=None\nrequest_metrics=[]\ndef call(path,headers,body=None):\n global last_start\n if last_start is not None:time.sleep(max(0,1.0-(time.perf_counter()-last_start)))\n last_start=time.perf_counter();start=last_start\n req=urllib.request.Request(BASE+path,headers=headers,data=body)\n try:\n  with urllib.request.urlopen(req,timeout=20) as r:status,raw=r.status,r.read()\n except urllib.error.HTTPError as e:status,raw=e.code,e.read()\n except Exception as e:\n  status,raw=None,b'{}'\n elapsed=time.perf_counter()-start\n try:data=json.loads(raw)\n except (ValueError,UnicodeError):data={}\n if not isinstance(data,dict):data={}\n result={'http_status':status,'seconds':round(elapsed,6),'rt_cd':str(data.get('rt_cd',''))[:16],'msg_cd':str(data.get('msg_cd',data.get('error_code','')))[:40]}\n request_metrics.append(result)\n return data,result\n\ndef market_call(path,headers):\n attempts=[]\n for attempt in range(3):\n  data,metric=call(path,headers);attempts.append(metric)\n  if metric['http_status']!=429 and metric['msg_cd']!='EGW00201':break\n  if attempt<2:time.sleep(3*(attempt+1))\n return data,metric,attempts\n\ndef safe_row(row,fields):\n return {k:str(row[k]) for k in fields if k in row and re.fullmatch(r'-?\\d+(?:\\.\\d+)?',str(row[k]))}\ndef rows(data):\n x=data.get('output2',[])\n return [r for r in (x if isinstance(x,list) else [x]) if isinstance(r,dict)]\ndef valid_date(s):\n try:dt.datetime.strptime(str(s),'%Y%m%d');return True\n except (TypeError,ValueError):return False\n\ndef check_history(data):\n entries=rows(data);dates=[r.get('stck_bsop_date','') for r in entries]\n required=['stck_bsop_date','frgn_ntby_qty','frgn_ntby_tr_pbmn','frgn_shnu_tr_pbmn','frgn_seln_tr_pbmn','frgn_shnu_vol','frgn_seln_vol']\n missing=sum(any(k not in r or not re.fullmatch(r'-?\\d+',str(r[k])) for k in required) for r in entries)\n return {'rows':len(entries),'missing_required_rows':missing,'duplicate_dates':len(dates)-len(set(dates)),'invalid_or_future_dates':sum(not valid_date(d) or str(d)>DATE for d in dates),'dates':sorted(set(dates),reverse=True)}\n\nif not all(SECRETS):emit({'stage':'configuration','secrets_present':False});sys.exit(1)\nstart_all=time.perf_counter()\npayload,auth=call('/oauth2/tokenP',{'Content-Type':'application/json'},json.dumps({'grant_type':'client_credentials','appkey':SECRETS[0],'appsecret':SECRETS[1]}).encode())\ntoken=payload.get('access_token')\nauth_ok=auth['http_status']==200 and isinstance(token,str) and bool(token)\nif auth_ok:SECRETS.append(token);print('::add-mask::'+escape(token),flush=True)\nemit({'stage':'authentication','success':auth_ok,'request':auth,'run_id':os.environ.get('GITHUB_RUN_ID'),'checked_at_utc':dt.datetime.now(dt.timezone.utc).isoformat()})\nif not auth_ok:sys.exit(1)\nheaders={'authorization':'Bearer '+token,'appkey':SECRETS[0],'appsecret':SECRETS[1],'custtype':'P','Content-Type':'application/json; charset=utf-8'}\nresults=[]\nstart_collection=time.perf_counter()\nfor market,symbol,name in SYMBOLS:\n start_symbol=time.perf_counter()\n params={'FID_COND_MRKT_DIV_CODE':'J','FID_INPUT_ISCD':symbol,'FID_INPUT_DATE_1':DATE,'FID_ORG_ADJ_PRC':'','FID_ETC_CLS_CODE':''}\n flow,fm,fa=market_call('/uapi/domestic-stock/v1/quotations/investor-trade-by-stock-daily?'+urllib.parse.urlencode(params),headers|{'tr_id':'FHPTJ04160001'})\n params={'FID_COND_MRKT_DIV_CODE':'J','FID_INPUT_ISCD':symbol,'FID_INPUT_DATE_1':DATE,'FID_INPUT_DATE_2':DATE,'FID_PERIOD_DIV_CODE':'D','FID_ORG_ADJ_PRC':'1'}\n price,pm,pa=market_call('/uapi/domestic-stock/v1/quotations/inquire-daily-itemchartprice?'+urllib.parse.urlencode(params),headers|{'tr_id':'FHKST03010100'})\n frows=[r for r in rows(flow) if r.get('stck_bsop_date')==DATE]\n prows=[r for r in rows(price) if r.get('stck_bsop_date')==DATE]\n ff=['stck_bsop_date','stck_clpr','stck_oprc','stck_hgpr','stck_lwpr','acml_vol','acml_tr_pbmn','frgn_ntby_qty','frgn_ntby_tr_pbmn','frgn_shnu_tr_pbmn','frgn_seln_tr_pbmn','frgn_shnu_vol','frgn_seln_vol']\n pf=['stck_bsop_date','stck_clpr','stck_oprc','stck_hgpr','stck_lwpr','acml_vol','acml_tr_pbmn']\n f=safe_row(frows[0],ff) if len(frows)==1 else {}\n p=safe_row(prows[0],pf) if len(prows)==1 else {}\n checks={\n  'net_amount_arithmetic':all(k in f for k in ['frgn_ntby_tr_pbmn','frgn_shnu_tr_pbmn','frgn_seln_tr_pbmn']) and int(f['frgn_shnu_tr_pbmn'])-int(f['frgn_seln_tr_pbmn'])==int(f['frgn_ntby_tr_pbmn']),\n  'net_quantity_arithmetic':all(k in f for k in ['frgn_ntby_qty','frgn_shnu_vol','frgn_seln_vol']) and int(f['frgn_shnu_vol'])-int(f['frgn_seln_vol'])==int(f['frgn_ntby_qty']),\n  'close_matches':bool(f.get('stck_clpr')) and f.get('stck_clpr')==p.get('stck_clpr'),\n  'volume_matches':bool(f.get('acml_vol')) and f.get('acml_vol')==p.get('acml_vol'),\n  'turnover_matches':bool(f.get('acml_tr_pbmn')) and f.get('acml_tr_pbmn')==p.get('acml_tr_pbmn')}\n history=check_history(flow)\n success=fm['http_status']==200 and fm['rt_cd']=='0' and bool(f) and pm['http_status']==200 and pm['rt_cd']=='0' and bool(p)\n out1=flow.get('output1',{})\n if not isinstance(out1,dict):out1={}\n record={'symbol':symbol,'name':name,'selected_market':market,'provider_market_name':str(out1.get('rprs_mrkt_kor_name',''))[:50],'market_code':'J','date':DATE,'success':success,'flow_request':fm,'price_request':pm,'flow_attempts':fa,'price_attempts':pa,'flow':f,'price':p,'checks':checks,'history':history,'seconds_including_throttle':round(time.perf_counter()-start_symbol,6)}\n results.append(record)\n\nelapsed=time.perf_counter()-start_collection\npacked=base64.b64encode(gzip.compress(json.dumps(results,ensure_ascii=False,separators=(',',':')).encode())).decode()\nfor offset in range(0,len(packed),2800):\n emit({'stage':'sample_chunk','part':offset//2800,'total':(len(packed)+2799)//2800,'gzip_base64':packed[offset:offset+2800]})\nlatencies=[m['seconds'] for m in request_metrics[1:]]\nflows=[r['flow_request']['seconds'] for r in results]\nsummary={'stage':'summary','date':DATE,'symbols':len(results),'success_count':sum(r['success'] for r in results),'failed_symbols':[r['symbol'] for r in results if not r['success']],'check_failures':{r['symbol']:[k for k,v in r['checks'].items() if not v] for r in results if not all(r['checks'].values())},'collection_seconds':round(elapsed,6),'total_seconds_including_auth':round(time.perf_counter()-start_all,6),'mean_symbol_seconds':round(statistics.mean(r['seconds_including_throttle'] for r in results),6),'api_request_count_excluding_auth':len(latencies),'api_mean_seconds':round(statistics.mean(latencies),6),'api_p95_seconds':round(sorted(latencies)[int(len(latencies)*.95)-1],6),'flow_api_mean_seconds':round(statistics.mean(flows),6),'flow_api_p95_seconds':round(sorted(flows)[int(len(flows)*.95)-1],6),'throttle_max_requests_per_second':1,'throttle_error_count':sum(m['http_status']==429 or m['msg_cd']=='EGW00201' for m in request_metrics),'retry_count':len(request_metrics)-41,'amount_unit_officially_verified':False}\nemit(summary)\nsys.exit(0 if summary['success_count']==20 and not summary['check_failures'] else 1)\nPY\n"
        }
      ]
    }
  }
}
