name: Preserve existing research artifact (zero market calls)
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: research-price-pilot
          path: research-results/pilot
          run-id: 39381006174
          github-token: ${{ github.token }}
      - name: Preserve existing public market responses on research branch only
        env:
          RESEARCH_BRANCH: research/flow-stage-pilot-20261020-063251
        run: |
          test "$GITHUB_REF_NAME" = "$RESEARCH_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research-results/pilot
          git commit -m 'Preserve existing bounded research responses; no new API calls'
          git push origin "HEAD:refs/heads/$RESEARCH_BRANCH"
