name: Manual bounded official research crosscheck
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kis-validation-auth
  cancel-in-progress: false
  queue: max
jobs:
  probe:
    if: github.ref_name == 'research/full-market-transition-20261019'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/full-market-transition-20261019
      - name: Configure research-only checkpoint commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Collect approved official references (maximum eight physical requests)
        timeout-minutes: 6
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python research/risk-performance/official_probe.py
      - name: Preserve research checkpoint even on failure
        if: always()
        run: |
          test "$GITHUB_REF_NAME" = 'research/full-market-transition-20261019'
          git add -- research/risk-performance/official-crosscheck
          if ! git diff --cached --quiet; then
            git commit -m "Preserve bounded research batch $GITHUB_RUN_ID"
            git push origin HEAD:refs/heads/research/full-market-transition-20261019
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-batch-${{ github.run_id }}
          path: research/risk-performance/official-crosscheck
          retention-days: 30
