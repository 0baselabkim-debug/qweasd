name: Research price pilot (bounded, no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kis-validation-auth
  cancel-in-progress: false
  queue: max
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Collect ten research samples only
        timeout-minutes: 9
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python research/pilot_collect.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-price-pilot
          path: research-output/
          retention-days: 30
