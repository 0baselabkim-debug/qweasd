name: Native two-repository shared account lease proof (no KIS HTTP)
on:
  push:
    branches: [fix/shared-operating-20261030]
    paths: [.github/trials/shared-native-20261030.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: kis-shared-native-proof-20261030
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prove shared exclusion and handover without KIS credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KIS_COORDINATOR_TOKEN: ${{ secrets.KIS_COORDINATOR_TOKEN }}
        run: python -m kis_shared.native_rollout
