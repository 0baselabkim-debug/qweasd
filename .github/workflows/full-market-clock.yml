name: One-off full-market reliable clock
on:
  push:
    branches: [feat/market-data-collector-v1]
    paths: [.github/experiments/full-market-clock.json]
permissions:
  contents: read
  actions: write
  issues: write
concurrency:
  group: full-market-20261026-clock
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m collector_v1.experiment.timekeeper authorize
  round1:
    needs: [authorize]
    if: always() && needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python -m collector_v1.experiment.timekeeper phase --round 1
  round2:
    needs: [authorize, round1]
    if: always() && needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python -m collector_v1.experiment.timekeeper phase --round 2
  round3:
    needs: [authorize, round2]
    if: always() && needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python -m collector_v1.experiment.timekeeper phase --round 3
  round4:
    needs: [authorize, round3]
    if: always() && needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python -m collector_v1.experiment.timekeeper phase --round 4
  cleanup:
    needs: [authorize, round4]
    if: always() && needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python -m collector_v1.experiment.timekeeper cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-market-clock-final-report
          path: data/full-market-20261026/clock-final-report.json
          retention-days: 7
          if-no-files-found: warn
