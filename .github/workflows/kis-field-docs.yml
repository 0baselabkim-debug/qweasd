{
  "name": "KIS official field documentation",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/kis-field-docs.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "docs": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 2,
      "steps": [
        {
          "name": "Read public official field documentation without credentials",
          "shell": "bash",
          "run": "python3 - <<'PY'\nimport urllib.request,urllib.parse,urllib.error,json,re,gzip,base64\nBASE='https://apiportal.koreainvestment.com'\nrecords=[]\ndef get(path):\n try:\n  with urllib.request.urlopen(BASE+path,timeout=20) as r:d=json.load(r)\n  return d\n except Exception as e:records.append({'url':BASE+path,'status':getattr(e,'code',None),'error_type':type(e).__name__});return None\npath='/api/apis/public/detail?'+urllib.parse.urlencode({'accessUrl':'/uapi/domestic-stock/v1/quotations/investor-trade-by-stock-daily'})\nd=get(path)\nif isinstance(d,dict):\n records.append({'kind':'api_detail','url':BASE+path,'data':{k:v for k,v in d.items() if k in ['id','name','apiSummary','summary','accessUrl','httpMethod','apiCollectionName']}})\n props=get('/api/apis/guide/property/'+d['id'])\n if isinstance(props,list):\n  matches=[p for p in props if any(k in json.dumps(p,ensure_ascii=False).lower() for k in ['frgn_ntby_tr_pbmn','frgn_shnu_tr_pbmn','frgn_seln_tr_pbmn','acml_tr_pbmn','fid_cond_mrkt_div_code'])]\n  records.append({'kind':'field_definitions','url':BASE+'/api/apis/guide/property/'+d['id'],'properties':matches})\nfaqpath='/api/forums/10000000-0000-0011-0000-000000000002/posts?size=100&page=0&sort=fixOnTop,desc'\nf=get(faqpath)\nposts=f if isinstance(f,list) else f.get('content',[]) if isinstance(f,dict) else []\nrecords.append({'kind':'faq_list','url':BASE+faqpath,'count':len(posts),'titles':[{'id':p.get('id'),'title':p.get('title')} for p in posts]})\nselected=[p for p in posts if any(s in str(p.get('title','')) for s in ['\uc720\ub7c9','\ud638\ucd9c','\uc81c\ud55c'])]\nfor p in selected[:3]:\n path='/api/forums/10000000-0000-0011-0000-000000000002/posts/'+p['id'];v=get(path)\n if isinstance(v,dict):records.append({'kind':'faq_detail','url':BASE+path,'data':{k:v[k] for k in ['id','title','content','createdDate','modifiedDate'] if k in v}})\npacked=base64.b64encode(gzip.compress(json.dumps(records,ensure_ascii=False).encode())).decode()\nfor i in range(0,len(packed),2800):\n rec={'url':BASE+'/official-spec-and-faq','status':200,'final_url':BASE+'/official-spec-and-faq','part':i//2800,'total':(len(packed)+2799)//2800,'gzip_base64':packed[i:i+2800]}\n print('::notice title=KIS public document chunk::'+json.dumps(rec,separators=(',',':')))\nPY\n"
        }
      ]
    }
  }
}
