{
  "name": "KIS official field documentation",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/kis-field-docs.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "docs": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 3,
      "steps": [
        {
          "name": "Read public official field documentation without credentials",
          "shell": "bash",
          "run": "python3 - <<'PY'\nimport urllib.request,urllib.parse,json,gzip,base64,re,html\nBASE='https://apiportal.koreainvestment.com';records=[]\ndef get(path):\n try:\n  with urllib.request.urlopen(BASE+path,timeout=20) as r:return json.load(r)\n except Exception as e:records.append({'url':BASE+path,'status':getattr(e,'code',None),'error_type':type(e).__name__});return None\nfor forum,page in [('10000000-0000-0011-0000-000000000002',0),('10000000-0000-0011-0000-000000000002',1),('10000000-0000-0011-0000-000000000001',0)]:\n path='/api/forums/'+forum+'/posts?size=100&page='+str(page)+'&sort=fixOnTop,desc';f=get(path)\n posts=f if isinstance(f,list) else f.get('content',[]) if isinstance(f,dict) else []\n selected=[p for p in posts if re.search('\uc720\ub7c9|\ucd08\ub2f9|\ud638\ucd9c.{0,10}(\ud55c\ub3c4|\uc81c\ud55c)|\ud1a0\ud070\ubc1c\uae09.*1\ubd84|\uc77c\uc790\ubcc4 \ud22c\uc790\uc790',str(p.get('title','')))]\n records.append({'kind':'list_search','url':BASE+path,'received':len(posts),'matches':[{'id':p.get('id'),'title':p.get('title')} for p in selected]})\n for p in selected[:8]:\n  q='/api/forums/'+forum+'/posts/'+p['id'];v=get(q)\n  if isinstance(v,dict):\n   text=html.unescape(re.sub('<[^>]*>',' ',v.get('content','')))\n   records.append({'kind':'official_notice','url':BASE+'/community/'+forum+'/post/'+p['id'],'title':v.get('title'),'created':v.get('createdDate'),'modified':v.get('lastModifiedDate'),'text':text})\np='/api/apis/public/detail?'+urllib.parse.urlencode({'accessUrl':'/uapi/domestic-stock/v1/quotations/inquire-daily-itemchartprice'})\nd=get(p)\nif isinstance(d,dict):\n records.append({'kind':'price_detail','url':BASE+p,'id':d.get('id'),'summary':d.get('apiSummary')})\n f=get('/api/apis/guide/property/'+d['id'])\n if isinstance(f,list):records.append({'kind':'price_fields','properties':[r for r in f if r.get('propertyCd','').lower() in ['acml_tr_pbmn','fid_cond_mrkt_div_code','stck_clpr','acml_vol','fid_org_adj_prc']]})\npacked=base64.b64encode(gzip.compress(json.dumps(records,ensure_ascii=False).encode())).decode()\nfor i in range(0,len(packed),2800):\n rec={'url':BASE+'/official-rate-and-price-spec','status':200,'final_url':BASE+'/official-rate-and-price-spec','part':i//2800,'total':(len(packed)+2799)//2800,'gzip_base64':packed[i:i+2800]}\n print('::notice title=KIS public document chunk::'+json.dumps(rec,separators=(',',':')))\nPY\n"
        }
      ]
    }
  }
}
