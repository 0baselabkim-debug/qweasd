{
  "name": "KIS official field documentation",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/kis-field-docs.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "docs": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 2,
      "steps": [
        {
          "name": "Read public official field documentation without credentials",
          "shell": "bash",
          "run": "python3 - <<'PY'\nimport urllib.request,urllib.error,json,re,html,gzip,base64\nfrom html.parser import HTMLParser\nclass Parse(HTMLParser):\n def __init__(self):super().__init__();self.in_script=False;self.scripts=[];self.text=[]\n def handle_starttag(self,t,a):\n  if t=='script':self.in_script=True\n def handle_endtag(self,t):\n  if t=='script':self.in_script=False\n def handle_data(self,s):\n  if self.in_script:self.scripts.append(s)\n  elif s.strip():self.text.append(s.strip())\nurls=['https://apiportal.koreainvestment.com/apiservice-apiservice?/uapi/domestic-stock/v1/quotations/investor-trade-by-stock-daily','https://apiportal.koreainvestment.com/faq-faq']\nfor url in urls:\n try:\n  with urllib.request.urlopen(url,timeout=20) as r:body=r.read().decode('utf-8',errors='replace');status=r.status;final=r.url\n  p=Parse();p.feed(body)\n  script='\\n'.join(p.scripts)\n  snippets=[]\n  for match in re.finditer(r'UNO.HTTP|getApi|loadApi|makePostUrl|pageOptions =|frgn_ntby|\ubc31\ub9cc|\ucd08\ub2f9|\uc720\ub7c9',script):snippets.append(script[max(0,match.start()-200):match.end()+1500])\n  result={'url':url,'final_url':final,'script_snippets':snippets,'visible_text':'\\n'.join(p.text)[-35000:]}\n  packed=base64.b64encode(gzip.compress(json.dumps(result,ensure_ascii=False).encode())).decode()\n  \n  for i in range(0,min(len(packed),11200),2800):\n   record={'url':url,'status':status,'final_url':final,'part':i//2800,'total':(len(packed)+2799)//2800,'gzip_base64':packed[i:i+2800]}\n   print('::notice title=KIS public document chunk::'+json.dumps(record,separators=(',',':')))\n except Exception as e:print('::notice title=KIS portal routes::'+json.dumps({'url':url,'status':getattr(e,'code',None),'error_type':type(e).__name__}))\nPY\n"
        }
      ]
    }
  }
}
