{
  "name": "KIS official field documentation",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/kis-field-docs.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "docs": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 2,
      "steps": [
        {
          "name": "Read public official field documentation without credentials",
          "shell": "bash",
          "run": "python3 - <<'PY'\nimport urllib.request,urllib.error,json,re,html\nurls=['https://apiportal.koreainvestment.com/','https://apiportal.koreainvestment.com/intro','https://apiportal.koreainvestment.com/faq']\nfor url in urls:\n try:\n  with urllib.request.urlopen(url,timeout=15) as r:body=r.read().decode('utf-8',errors='replace');status=r.status;final=r.url\n  record={'url':url,'status':status,'final_url':final,'title':re.findall(r'<title>(.*?)</title>',body,re.S)[:1],'scripts':re.findall(r'<script[^>]+src=[\\\"\\x27]([^\\\"\\x27]+)',body)[:40],'links':[x for x in re.findall(r'href=[\\\"\\x27]([^\\\"\\x27]+)',body) if any(s in x for s in ['api','faq','notice'])][:40]}\n except Exception as e:record={'url':url,'status':getattr(e,'code',None),'error_type':type(e).__name__}\n text=json.dumps(record,ensure_ascii=True).replace('%','%25').replace('\\r','%0D').replace('\\n','%0A')\n print('::notice title=KIS portal routes::'+text)\nPY\n"
        }
      ]
    }
  }
}
