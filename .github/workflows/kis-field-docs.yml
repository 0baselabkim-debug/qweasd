{
  "name": "KIS official field documentation",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/kis-field-docs.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "docs": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 2,
      "steps": [
        {
          "name": "Read public official field documentation without credentials",
          "shell": "bash",
          "run": "python3 - <<'PY'\nimport urllib.request, urllib.error, json, re, html, gzip, base64\nurls=['https://apiportal.koreainvestment.com/apiservice-apiservice','https://apiportal.koreainvestment.com/faq-faq']\nfor url in urls:\n try:\n  with urllib.request.urlopen(url,timeout=20) as r:body=r.read();status=r.status;final=r.url\n  packed=base64.b64encode(gzip.compress(body)).decode()\n  for i in range(0,len(packed),2800):\n   record={'url':url,'status':status,'final_url':final,'part':i//2800,'total':(len(packed)+2799)//2800,'gzip_base64':packed[i:i+2800]}\n   print('::notice title=KIS public document chunk::'+json.dumps(record,separators=(',',':')))\n except Exception as e:print('::notice title=KIS portal routes::'+json.dumps({'url':url,'status':getattr(e,'code',None),'error_type':type(e).__name__}))\nPY\n"
        }
      ]
    }
  }
}
