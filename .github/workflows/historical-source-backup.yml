name: Finite historical original byte preservation
on:
  push:
    branches: [feat/decision-evidence-v2]
    paths: ['.github/recovery/historical-source-backup.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: historical-original-byte-preservation-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  preserve:
    if: github.repository == '0baselabkim-debug/qweasd' && github.ref == 'refs/heads/feat/decision-evidence-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve verified original ZIPs; no provider credentials or calls
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/preserve_historical_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-original-bytes-${{ github.run_id }}
          path: ${{ runner.temp }}/historical-source-backup
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
