name: Publish briefing from verified snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kis-validation-auth
  cancel-in-progress: false
  queue: max
jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest==9.1.1
      - name: Test historical fixture and independent raw reconciliation
        run: python -m pytest -q tests/test_daily_briefing.py
      - name: Export current verified snapshot without market API calls
        run: |
          day=$(python -c "import json;print(json.load(open('snapshot/manifest.json'))['asof'])")
          python scripts/export_daily_briefing.py --asof "$day" --output snapshot/daily_briefing.json
      - name: Publish only validated briefing, or no-op if unchanged
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snapshot/daily_briefing.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish independently verified daily flow briefing'
          # Concurrent main changes reject the push; no forced merge with a new snapshot.
          git push origin HEAD:main
      - name: Confirm unauthenticated public JSON and exact contents
        run: python scripts/check_public_briefing.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-briefing-validation
          path: |
            briefing-failure.json
            reports/briefing-automation/public-check.json
          if-no-files-found: ignore
