name: Independent manual KIS provisional collector
run-name: KIS manual controlled ${{ github.run_id }}
on:
  push:
    branches: [feat/market-data-collector-v1]
    paths: [.github/trials/kis-manual-20261026.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: kis-validation-auth
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest==9.1.1
      - name: Offline manual execution safeguards
        run: python -m pytest -q tests/test_kis_manual.py
      - name: Approved manual KIS-only requests with persistent physical budget
        env:
          GH_TOKEN: ${{ github.token }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python -m collector_v1.kis_manual_actions run
      - name: Seal raw responses and ledger even after failure
        if: always()
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python -m collector_v1.kis_manual_actions seal
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('data/kis-manual-20261026/manifest.json') != '' && hashFiles('data/kis-manual-DO_NOT_UPLOAD') == ''
        with:
          name: kis-manual-state-20261026
          path: data/kis-manual-20261026
          retention-days: 14
          if-no-files-found: error
      - name: Publish sanitized machine-readable result to feature branch
        if: always() && hashFiles('data/kis-manual-20261026/manifest.json') != '' && hashFiles('data/kis-manual-DO_NOT_UPLOAD') == ''
        env:
          GH_TOKEN: ${{ github.token }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python -m collector_v1.kis_manual_actions publish
