{
  "name": "KIS 9443 connection only",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/kis-connectivity.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "kis-connectivity-probe",
    "cancel-in-progress": true
  },
  "jobs": {
    "probe": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 3,
      "steps": [
        {
          "name": "Test official KIS HTTPS without credentials",
          "shell": "bash",
          "run": "python3 - <<'PY'\nimport json, os, pathlib, subprocess, sys, datetime\nroot=pathlib.Path('kis-probe-results');root.mkdir(exist_ok=True)\nchecks=[('kis_9443_head','https://openapi.koreainvestment.com:9443/','HEAD'),('kis_token_transport_only','https://openapi.koreainvestment.com:9443/oauth2/tokenP','POST'),('https_control','https://api.github.com/','GET')]\nresults=[]\nfor name,url,method in checks:\n    body=root/(name+'.body')\n    headers=root/(name+'.headers')\n    cmd=['curl','--silent','--show-error','--retry','0','--connect-timeout','10','--max-time','30','--dump-header',str(headers),'--output',str(body),'--write-out','%{json}']\n    if method=='HEAD':cmd+=['--head']\n    if method=='POST':cmd+=['--request','POST','--header','Content-Type: application/json','--data','{\"grant_type\":\"client_credentials\"}']\n    cmd+=[url]\n    run=subprocess.run(cmd,capture_output=True,text=True)\n    try:meta=json.loads(run.stdout)\n    except ValueError:meta={}\n    record={'name':name,'method':method,'url':url,'curl_exit':run.returncode,\n            'http_status':meta.get('http_code',meta.get('response_code')),\n            'proxy_connect_status':meta.get('http_connect'),\n            'tls_verify_result':meta.get('ssl_verify_result'),\n            'destination_ip':meta.get('remote_ip'),\n            'destination_port':meta.get('remote_port'),\n            'error':run.stderr[:1000],\n            'response_excerpt':body.read_text(errors='replace')[:2500] if body.exists() else ''}\n    record['kis_application_error']=False\n    if name=='kis_token_transport_only':\n        try:\n            payload=json.loads(record['response_excerpt'])\n            record['kis_application_error']=isinstance(payload,dict) and any(k in payload for k in ['error_code','error_description','msg_cd','msg1'])\n        except ValueError:pass\n    results.append(record)\nreport={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),\n        'runner':'GitHub-hosted ubuntu-latest','github_run_id':os.environ.get('GITHUB_RUN_ID'),\n        'github_sha':os.environ.get('GITHUB_SHA'),'authentication_attempt_with_credentials':False,\n        'secrets_used':False,'actual_foreign_flow_received':False,'checks':results}\nprobe=next(r for r in results if r['name']=='kis_token_transport_only')\nreport['kis_application_reached']=probe['curl_exit']==0 and probe['tls_verify_result']==0 and probe['kis_application_error']\n(root/'results.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\\n')\nprint(json.dumps(report,ensure_ascii=False,indent=2))\nsummary=['# KIS 9443 connectivity only','', 'No secrets, account data, access tokens, source code or database were used.', '',\n         '| Probe | curl exit | HTTPS status | Proxy CONNECT | TLS verify |', '|---|---:|---:|---:|---:|']\nfor r in results:summary.append(f\"| {r['name']} | {r['curl_exit']} | {r['http_status']} | {r['proxy_connect_status']} | {r['tls_verify_result']} |\")\nsummary+=['',f\"KIS application response reached: {report['kis_application_reached']}\",\n          'The POST intentionally omits appkey/appsecret. A KIS missing-credential error proves reachability, not authentication or data collection.',\n          'TLS verify 0 alone is not success if curl failed. Proxy CONNECT 0 is normal for a direct runner connection.', '',\n          '```json',json.dumps(report,ensure_ascii=False,indent=2).replace('```','~~~'),'```']\npathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\\n'.join(summary)+'\\n')\nsys.exit(0 if report['kis_application_reached'] else 1)\nPY\n"
        }
      ]
    }
  }
}
