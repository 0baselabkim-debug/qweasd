name: Independent V2 fixed artifact verification (no KIS HTTP)
on:
  push:
    branches: [feat/decision-evidence-v2]
    paths: [.github/trials/decision-v2-source-20261029.json]
permissions:
  contents: write
  actions: read
  pull-requests: write
concurrency:
  group: independent-decision-v2-source-20261029
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Download fixed original and verify ZIP, raw records and ledger
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/decision_v2_native.py
      - uses: actions/upload-artifact@v4
        id: analysis
        if: success() && steps.native.outputs.analysis_bundle == 'true'
        with:
          name: decision-v2-analysis-20261029-${{ github.run_id }}
          path: ${{ runner.temp }}/decision-v2-analysis/
          retention-days: 90
          if-no-files-found: error
      - name: Verify actual stored output ZIP and every file
        if: steps.analysis.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_ARTIFACT_ID: ${{ steps.analysis.outputs.artifact-id }}
          RESULT_ARTIFACT_DIGEST: ${{ steps.analysis.outputs.artifact-digest }}
        run: python scripts/decision_v2_native.py finalize
