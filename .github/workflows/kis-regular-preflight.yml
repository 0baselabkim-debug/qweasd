name: Verify registered 20:30 KIS schedule (no market HTTP)
on:
  push:
    branches: [fix/regular-readiness-20261030]
    paths: [.github/trials/regular-preflight-20261030.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: kis-regular-preflight-20261030
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Audit actual main registration, blockers, lease and existing secret presence
        env:
          GH_TOKEN: ${{ github.token }}
          KIS_APP_KEY_PRESENT: ${{ secrets.KIS_APP_KEY != '' }}
          KIS_APP_SECRET_PRESENT: ${{ secrets.KIS_APP_SECRET != '' }}
        run: python -m scripts.regular_2030_preflight
