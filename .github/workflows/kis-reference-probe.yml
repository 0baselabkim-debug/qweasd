name: Official reference metadata probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/kis_reference_probe.py
      - name: Export reference batch 1
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=Path('reference-data.b64').read_text();c=[s[i:i+2800] for i in range(0,len(s),2800)]
          assert len(c)<=96
          for i in range(0,min(8,len(c))):print('::notice title=Reference data::'+json.dumps({'part':i,'parts':len(c),'data':c[i]}))
          PY
