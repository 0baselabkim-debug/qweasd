name: Daily validated dashboard refresh
on:
  schedule:
    - cron: '30 9 * * 1-5'
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Collect today or replay saved observations and check the official calendar'
        type: choice
        options: [collect, verify_saved]
        default: collect
permissions:
  contents: write
  actions: read
concurrency:
  group: kis-validation-auth
  cancel-in-progress: false
  queue: max
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest==9.1.1
      - name: Record actual runner start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "refresh") | .started_at' | head -1)
          echo "JOB_STARTED_AT=$started" >> "$GITHUB_ENV"
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          echo "RUN_CREATED_AT=$created" >> "$GITHUB_ENV"
      - name: Choose scheduled trading date and restore only its checkpoint
        id: target
        env:
          MODE: ${{ inputs.mode || 'collect' }}
        run: |
          git fetch origin main
          git merge --ff-only origin/main
          python - <<'PY'
          import datetime as dt,json,os
          from pathlib import Path
          from zoneinfo import ZoneInfo
          now=dt.datetime.now(ZoneInfo('Asia/Seoul'))
          # A queued late-evening run may start after midnight; never query that new day before its close.
          from screener.collection_schedule import target_date
          created=dt.datetime.fromisoformat(os.environ['RUN_CREATED_AT'].replace('Z','+00:00'))
          day=target_date(now,created)
          if os.environ['MODE']=='verify_saved':day=dt.date.fromisoformat(json.loads(Path('snapshot/manifest.json').read_text())['asof'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('day='+day.strftime('%Y%m%d')+'\n')
          ledger=Path('snapshot/publication-ledger.json')
          done=os.environ['MODE']=='collect' and ((ledger.exists() and str(day) in json.loads(ledger.read_text())) or json.loads(Path('snapshot/manifest.json').read_text())['asof']>=str(day))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('already_published='+str(done).lower()+'\n')
          Path('daily-results').mkdir(exist_ok=True)
          PY
      - name: Load checkpoint or trusted complete artifact
        if: steps.target.outputs.already_published != 'true'
        env:
          DAY: ${{ steps.target.outputs.day }}
          MODE: ${{ inputs.mode || 'collect' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$MODE" = verify_saved ]; then
            cp research/daily-replay.json.gz daily-results/bundle.json.gz
          else
            python scripts/daily_saved_recovery.py load --day "$DAY"
          fi
      - name: Collect only missing stocks for this trading date
        id: collect
        if: inputs.mode != 'verify_saved' && steps.target.outputs.already_published != 'true'
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          DAY: ${{ steps.target.outputs.day }}
        run: python -u scripts/collect_daily_snapshot.py --date "$DAY"
      - name: Verify official holiday endpoint during real-data rehearsal
        if: inputs.mode == 'verify_saved'
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          DAY: ${{ steps.target.outputs.day }}
        run: |
          python - <<'PY'
          import sys,json,os
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from kis_public_client import KIS
          api=KIS();day=os.environ['DAY']
          response=api.request('/uapi/domestic-stock/v1/quotations/chk-holiday',{'BASS_DT':day,'CTX_AREA_FK':'','CTX_AREA_NK':''},'CTCA0903R')
          rows=[r for r in response['output'] if r.get('bass_dt')==day]
          assert len(rows)==1 and rows[0]['opnd_yn']=='Y','Official calendar target mismatch'
          Path('daily-results/calendar-check.json').write_text(json.dumps({'trade_date':day,'endpoint':'CTCA0903R','actual_response':rows[0]},ensure_ascii=False,indent=2)+'\n')
          print('Official trading-day calendar validated')
          PY
      - name: Seal preserved original bytes
        id: seal
        if: always() && inputs.mode != 'verify_saved' && steps.target.outputs.already_published != 'true' && hashFiles('daily-results/bundle.json.gz') != ''
        env:
          DAY: ${{ steps.target.outputs.day }}
        run: python scripts/daily_saved_recovery.py receipt --day "$DAY"
      - name: Preserve resume ledger independently of publication
        id: checkpoint
        if: always() && steps.seal.outcome == 'success'
        continue-on-error: true
        env:
          DAY: ${{ steps.target.outputs.day }}
        run: python scripts/persist_daily_checkpoint.py --date "$DAY"
      - name: Preserve source artifact before publication
        id: source_backup
        if: always() && steps.seal.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: daily-source-${{ steps.target.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: daily-results/
          retention-days: 7
          if-no-files-found: error
      - name: Require a durable original before publication
        if: always() && steps.collect.outcome == 'success' && steps.target.outputs.already_published != 'true'
        env:
          SEALED: ${{ steps.seal.outcome }}
          CHECKPOINT: ${{ steps.checkpoint.outcome }}
          ARTIFACT: ${{ steps.source_backup.outcome }}
        run: python scripts/daily_saved_recovery.py durable
      - name: Validate and publish preserved bytes against current main
        if: steps.target.outputs.already_published != 'true'
        env:
          DAY: ${{ steps.target.outputs.day }}
          MODE: ${{ inputs.mode || 'collect' }}
        run: python scripts/daily_publish_transaction.py --bundle daily-results/bundle.json.gz --day "$DAY" --source-run "$GITHUB_RUN_ID" --mode "$MODE"
      - name: Preserve classified publication outcome
        if: always() && hashFiles('daily-publish-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: daily-publish-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: daily-publish-report.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-validation-${{ steps.target.outputs.day }}
          path: |
            daily-candidate/validation.json
            daily-candidate/daily_briefing.json
            daily-candidate/briefing/index.json
            briefing-failure.json
            daily-publication-evidence
            daily-recovery-result.json
            daily-results/bundle.json.gz
            daily-results/calendar-check.json
            daily-results/successes.jsonl
            daily-results/diagnostics
          retention-days: 7
          if-no-files-found: ignore

      - name: Record this attempt without changing market data
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ steps.target.outputs.day }}
          MODE: ${{ inputs.mode || 'collect' }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          JOB_STATUS: ${{ job.status }}
        run: |
          git fetch origin main
          git merge --ff-only origin/main
          python scripts/record_market_run.py
          python - <<'PY'
          import base64,json,os
          from pathlib import Path
          name=os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']+'.json'
          payload={'message':'Record market collection attempt '+name,'content':base64.b64encode((Path('operations/market-runs')/name).read_bytes()).decode()}
          Path('/tmp/market-operation-payload.json').write_text(json.dumps(payload))
          PY
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/operations/market-runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" --input /tmp/market-operation-payload.json --jq '.commit.sha'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-attempt-${{ github.run_id }}-${{ github.run_attempt }}
          path: operations/market-runs
          if-no-files-found: ignore
