name: Daily validated dashboard refresh
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: kis-validation-auth
  cancel-in-progress: false
  queue: max
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe only Taewon without checkpoint mutation
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python scripts/probe_taewon_krx.py
      - name: Preserve public market evidence on this diagnostic branch
        run: |
          test "$GITHUB_REF_NAME" = "fix/taewon-20261020"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/taewon-20261020
          git commit -m "Preserve bounded Taewon observations, not failure-time evidence"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taewon-diagnostic
          path: reports/taewon-20261020
