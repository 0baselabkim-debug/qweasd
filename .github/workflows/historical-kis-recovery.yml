name: Minimal historical KIS recovery (one failed symbol)
on:
  push:
    branches: [feat/decision-evidence-v2]
    paths: ['.github/recovery/historical-kis.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: kis-validation-auth
  cancel-in-progress: false
  queue: max
jobs:
  recovery:
    if: github.repository == '0baselabkim-debug/qweasd' && github.ref == 'refs/heads/feat/decision-evidence-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Recover only failed 002690; preserve parent 4693-request budget
        env:
          GH_TOKEN: ${{ github.token }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python scripts/recover_historical_kis.py .github/recovery/historical-kis.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-kis-minimal-${{ github.run_id }}
          path: ${{ runner.temp }}/kis-minimal-recovery
          retention-days: 90
          if-no-files-found: error
