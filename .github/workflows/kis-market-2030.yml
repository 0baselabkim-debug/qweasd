name: KIS regular trading-day whole market 20:30 KST
run-name: KIS regular 20:30 ${{ github.event_name }} run ${{ github.run_id }}
on:
  schedule:
    - cron: '30 11 * * 1-5'
  workflow_dispatch:
    inputs:
      operation:
        description: 'validate = no market HTTP; start = regular slot; resume = preserved failed source'
        type: choice
        options: [validate, start, resume]
        default: validate
        required: true
      asof:
        description: 'Explicit target trading date YYYY-MM-DD; required for start/resume'
        type: string
        required: false
      request_id:
        description: 'Unique operator request ID; never reuse'
        type: string
        required: false
      approval:
        description: 'USER_APPROVED_REGULAR_START or USER_APPROVED_REGULAR_RESUME'
        type: string
        required: false
      source_run:
        description: 'resume only: latest failed main Run with preserved state'
        type: string
        required: false
      not_before:
        description: 'resume only: timezone-aware approved start; default regular20:30'
        type: string
        required: false
      expires_at:
        description: 'resume only: <=170minutes and no later than next09:00 KST'
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/kis-market-2030.yml'
      - '.github/config/kis-regular-access.json'
      - 'collector_v1/**'
permissions:
  contents: write
  actions: read
concurrency:
  group: kis-validation-auth
  cancel-in-progress: false
  queue: max
jobs:
  regular:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.operation == 'resume' && 360 || 180 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Freeze schedule date and atomically claim its slot after the shared lock
        id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
          REGULAR_INPUTS_JSON: ${{ toJson(inputs) }}
          REQUESTED_CRON: ${{ github.event.schedule }}
        run: python -m collector_v1.regular.runner freeze
      - name: Install existing pinned dependencies
        id: install
        run: python -m pip install -r requirements.txt pytest==9.1.1
      - name: Offline regular-operation safeguards
        id: checks
        run: python -m pytest -q tests/test_regular_collector.py tests/test_regular_operations.py
      - name: Validate registration without market credentials, slot claims or market HTTP
        if: steps.freeze.outputs.operation == 'validate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m collector_v1.regular.runner validate
      - name: One fresh provisional generation; no separate recovery schedule
        id: collect
        if: steps.freeze.outputs.operation == 'start' && steps.freeze.outputs.collect == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Existing credentials; native rollout evidence and the central lease guard authentication.
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python -m collector_v1.regular.runner collect
      - name: Restore verified failed source without KIS credentials
        if: steps.freeze.outputs.operation == 'resume'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m collector_v1.regular.operator prepare
      - name: Verify stopped owner and wait for approved recovery window
        if: steps.freeze.outputs.operation == 'resume'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u -m collector_v1.regular.operator wait
      - name: Resume missing requests within the cumulative original budget
        if: steps.freeze.outputs.operation == 'resume'
        env:
          GH_TOKEN: ${{ github.token }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python -u -m collector_v1.regular.operator collect
      - name: Preserve and scan successful or partial state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python -m collector_v1.regular.runner seal
      - uses: actions/upload-artifact@v4
        id: archive
        if: always() && hashFiles('data/kis-regular/UPLOAD_ALLOWED') != ''
        with:
          name: ${{ steps.freeze.outputs.artifact_name || format('kis-regular-diagnostic-{0}', github.run_id) }}
          path: |
            data/kis-regular/
            !data/kis-regular/**/writer.lock
          retention-days: 90
          if-no-files-found: error
      - name: Confirm stored artifact before completing the ledger or handing off data
        if: always() && steps.freeze.outputs.operation == 'start'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.archive.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.archive.outputs.artifact-digest }}
        run: python -m collector_v1.regular.runner finalize
      - name: Verify stored recovery artifact and append exact-date recovery handoff
        if: always() && steps.freeze.outputs.operation == 'resume' && steps.archive.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.archive.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.archive.outputs.artifact-digest }}
        run: python -m collector_v1.regular.operator finalize
