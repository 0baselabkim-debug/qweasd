name: Historical official membership availability
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/probe_historical_membership.py
      - run: pip install duckdb==1.5.6 pandas==3.0.6
      - name: Verify future daily master parsing against official current files
        run: |
          python - <<'PY'
          import sys,json,datetime as dt
          from pathlib import Path
          from zoneinfo import ZoneInfo
          sys.path.insert(0,'scripts')
          from collect_daily_snapshot import master
          day=dt.datetime.now(ZoneInfo('Asia/Seoul')).strftime('%Y%m%d')
          rows,sources=master(day)
          report={'observed_on':day,'universe':len(rows),'halted':sum(r['halt']=='Y' for r in rows),'missing_master_industry':sum(not r['sector'] for r in rows),'sources':sources,'samples':[r for r in rows if r['symbol'] in ['005930','000660','035420']]}
          Path('reports/sector/daily-master-check.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({k:v for k,v in report.items() if k!='samples'},ensure_ascii=False))
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "evidence/membership-${GITHUB_RUN_ID}"
          git add reports/sector
          git commit -m 'Record official historical industry access evidence'
          git push origin HEAD
