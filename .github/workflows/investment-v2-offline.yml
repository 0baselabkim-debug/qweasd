name: Independent investment V2 offline regression
on:
  push:
    branches: [feat/decision-evidence-v2]
    paths:
      - 'screener/investment_v2/**'
      - 'screener/decision_evidence/**'
      - 'scripts/*investment*v2*.py'
      - 'tests/test_investment_v2.py'
      - '.github/workflows/investment-v2-offline.yml'
permissions:
  contents: read
concurrency:
  group: independent-investment-v2-offline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest==9.1.1
      - name: Full existing and new offline regression; no provider credentials
        run: python -m pytest -q --junitxml=investment-v2-tests.xml
      - name: Record test outcome
        if: always()
        run: |
          python - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          p=pathlib.Path('investment-v2-tests.xml')
          summary='NOT_RUN: no JUnit output'
          if p.exists():
              root=ET.parse(p).getroot()
              counts={k:sum(int(s.get(k,0)) for s in root.iter('testsuite')) for k in ('tests','failures','errors','skipped')}
              summary=str(counts)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Independent offline regression\n\n'+summary+'\n\nNo KIS, KRX, DART, macro or OpenAI live calls; no operating publication.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: investment-v2-offline-tests-${{ github.run_id }}
          path: investment-v2-tests.xml
          retention-days: 90
          if-no-files-found: error
