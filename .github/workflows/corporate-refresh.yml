name: Incremental corporate disclosures and theme review
on:
  schedule:
    - cron: '17 23,5,9,17 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [probe, collect]
        default: probe
      symbols:
        description: Optional comma-separated codes for a bounded pilot; blank scans the universe
        type: string
        default: ''
      limit:
        description: Maximum companies in this resumable batch
        type: number
        default: 120
permissions:
  contents: write
concurrency:
  group: corporate-disclosures
  cancel-in-progress: false
jobs:
  corporate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest==9.1.1
      - name: Verify DART credential with an actual filing response
        if: inputs.mode == 'probe'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python - <<'PY'
          import json,sys,datetime as dt
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from collect_corporate import Dart
          universe=json.loads(Path('corporate/universe.json').read_text())
          company=next(r for r in universe if r['symbol']=='005930')
          import os
          result={'key_present':bool(os.environ.get('DART_API_KEY')),'authenticated':False}
          try:
              r=Dart(max_calls=1).get('list.json',{'corp_code':company['corp_code'],'bgn_de':'20260101','end_de':dt.date.today().strftime('%Y%m%d'),'pblntf_ty':'A','page_count':100})
              assert r['status']=='000' and r.get('list'),'No actual filing received'
              result.update(authenticated=True,status=r['status'],filings_received=len(r['list']),latest_receipt=r['list'][0]['rcept_no'])
          except Exception as e:
              result['error']=str(e) if isinstance(e,ValueError) else type(e).__name__
          Path('corporate-probe.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          if not result['authenticated']:
              print('::error::DART probe '+str(result.get('error')))
              raise SystemExit(1)
          PY
      - name: Restore compatible unpublished progress
        if: inputs.mode != 'probe'
        run: |
          mkdir -p corporate-candidate
          if [ -f snapshot/corporate-state.json.gz ]; then cp snapshot/corporate-state.json.gz corporate-candidate/state.json.gz; fi
          if git ls-remote --exit-code --heads origin data/corporate-checkpoint >/dev/null 2>&1; then
            git fetch origin data/corporate-checkpoint
            git show FETCH_HEAD:corporate-checkpoint.json.gz > /tmp/corporate-checkpoint.json.gz
            python - <<'PY'
          import shutil
          from scripts.publish_corporate import validate
          from screener.corporate import load_state
          try:
              validate(load_state(),load_state('/tmp/corporate-checkpoint.json.gz'))
          except ValueError:
              print('Checkpoint predates published changes; retain published state')
          else:
              shutil.copy2('/tmp/corporate-checkpoint.json.gz','corporate-candidate/state.json.gz')
          PY
          fi
      - name: Collect changed disclosures and resume unfinished companies
        if: inputs.mode != 'probe'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PILOT_SYMBOLS: ${{ inputs.symbols || '' }}
          COMPANY_LIMIT: ${{ inputs.limit || 120 }}
        run: |
          python -u scripts/collect_corporate.py --state corporate-candidate/state.json.gz --db corporate-candidate/corporate.duckdb --limit "$COMPANY_LIMIT" --max-calls 600 --max-seconds 2100 --symbols "$PILOT_SYMBOLS"
      - name: Preserve progress independently of publication
        if: always() && inputs.mode != 'probe'
        run: python scripts/checkpoint_corporate.py
      - name: Validate append-only corporate records
        if: inputs.mode != 'probe'
        run: |
          python scripts/publish_corporate.py --validate-only
          python -m pytest -q tests/test_corporate.py
      - name: Publish corporate snapshot without changing the market database
        if: inputs.mode != 'probe'
        run: |
          git fetch origin main
          git merge --ff-only origin/main
          python scripts/publish_corporate.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snapshot/corporate-state.json.gz snapshot/corporate.duckdb snapshot/corporate-manifest.json
          git diff --cached --quiet || git commit -m 'Publish validated incremental corporate disclosures'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corporate-run-${{ github.run_id }}
          path: |
            corporate-run.json
            corporate-candidate/state.json.gz
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve bounded credential probe evidence
        if: always() && inputs.mode == 'probe'
        run: |
          if [ ! -f corporate-probe.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "evidence/corporate-$GITHUB_RUN_ID"
          git add corporate-probe.json
          git commit -m 'Record sanitized DART authentication result'
          git push origin "HEAD:evidence/corporate-$GITHUB_RUN_ID"

      - name: Preserve collection and publication evidence
        if: always() && inputs.mode != 'probe'
        run: |
          mkdir -p reports/corporate-run
          for name in corporate-run.json corporate-checkpoint-result.json; do
            if [ -f "$name" ]; then cp "$name" reports/corporate-run/; fi
          done
          if [ -f corporate-candidate/state.json.gz ]; then cp corporate-candidate/state.json.gz reports/corporate-run/state.json.gz; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "evidence/corporate-$GITHUB_RUN_ID"
          git add -f reports/corporate-run
          git diff --cached --quiet || git commit -m 'Record corporate collection and publication evidence'
          git push origin "HEAD:refs/heads/evidence/corporate-$GITHUB_RUN_ID"
