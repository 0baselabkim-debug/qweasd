<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e4efff;font:13px system-ui,sans-serif;color-scheme:dark}#toolbar{display:flex;align-items:center;gap:12px;padding:8px 1px}input{background:#0d1d33;border:1px solid #29476e;border-radius:6px;color:#e4efff;padding:8px;width:210px;max-width:65%}#count{color:#8faed2;font-size:12px}.scroll{max-height:510px;overflow:auto;border:1px solid #263f61;border-radius:8px}table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums;white-space:nowrap}th{position:sticky;top:0;background:#162c49;text-align:left;z-index:1;border-bottom:1px solid #345277;padding:0}th button{width:100%;text-align:inherit;border:0;border-radius:0;background:none;color:#c9ddfb;font:inherit;padding:11px 12px;cursor:pointer}td{padding:10px 12px;border-bottom:1px solid #1c304a;border-right:1px solid #17283e}tr:nth-child(even){background:#0d1a2c}tr:hover{background:#132b48}tr.selected{background:#1b365a;box-shadow:inset 3px 0 #3a88ff}.num{text-align:right}.up{color:#ff6384}.down{color:#59a0ff}.name{cursor:pointer;font-weight:650;color:#eff6ff}.name:hover{color:#73acff;text-decoration:underline}.name:focus-visible,button:focus-visible{outline:2px solid #6da9ff;outline-offset:-2px}.state{font-size:11px;border-radius:4px;background:#142e4f;padding:3px 6px;color:#bed6fa}.state.up{background:#3c2031;color:#ffa9bd}.empty{padding:35px;text-align:center;color:#96aecd}@media(pointer:coarse){td{padding:13px 10px}.name{touch-action:manipulation}}
</style></head><body><div id="toolbar"><input id="filter" aria-label="표 내 검색" placeholder="표 내 검색"><span id="count"></span></div><div class="scroll"><table><thead></thead><tbody></tbody></table></div><script>
let args={},sort=null,selected=null;
const send=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
const save=()=>sessionStorage.setItem('flow-ui:'+args.storage_key,JSON.stringify({sort,filter:document.querySelector('input').value,selected}));
const emit=(id,interaction)=>{save();send('streamlit:setComponentValue',{value:{id,interaction,nonce:Date.now()+Math.random()},dataType:'json'})};
function draw(){
 const q=document.querySelector('input').value.toLocaleLowerCase();let rows=args.rows.filter(r=>r.values.some(v=>String(v??'').toLocaleLowerCase().includes(q)));
 if(sort){const {col,asc}=sort;rows.sort((a,b)=>{let x=a.values[col],y=b.values[col];if(x==null)return y==null?0:1;if(y==null)return -1;return (typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'ko'))*(asc?1:-1)})}
 const head=document.querySelector('thead');head.replaceChildren();const tr=document.createElement('tr');args.columns.forEach((c,i)=>{const th=document.createElement('th');th.setAttribute('aria-sort',sort?.col===i?(sort.asc?'ascending':'descending'):'none');const b=document.createElement('button');b.textContent=c+(sort?.col===i?(sort.asc?' ▲':' ▼'):'');b.onclick=()=>{sort={col:i,asc:sort?.col===i?!sort.asc:true};save();draw()};th.append(b);tr.append(th)});head.append(tr);
 const body=document.querySelector('tbody');body.replaceChildren();
 rows.forEach(r=>{const tr=document.createElement('tr');tr.dataset.rowId=r.id;tr.classList.toggle('selected',selected===r.id);tr.onclick=()=>{selected=r.id;for(const t of body.children)t.classList.toggle('selected',t.dataset.rowId===r.id);save()};r.values.forEach((v,i)=>{const td=document.createElement('td');const col=args.columns[i];const numeric=typeof v==='number';td.textContent=v==null?'—':numeric?v.toLocaleString('ko-KR',{maximumFractionDigits:2}):v;if(numeric)td.classList.add('num');if(numeric&&(/억원|강도|증감/.test(col)))td.classList.add(v>0?'up':v<0?'down':'neutral');
 if(col==='수급 변화'){const badge=document.createElement('span');badge.className='state'+(/증가|순매수 전환/.test(v)?' up':'');badge.textContent=v??'자료 부족';td.replaceChildren(badge)}
 if(col===args.name_column){td.classList.add('name');td.tabIndex=0;td.setAttribute('aria-label',String(v));td.title='더블클릭하여 조회 · 터치 화면은 한 번 탭';td.addEventListener('dblclick',e=>{e.preventDefault();emit(r.id,'double_click')});td.addEventListener('pointerup',e=>{if(e.pointerType==='touch'||e.pointerType==='pen'){e.preventDefault();emit(r.id,'touch')}});td.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();emit(r.id,'keyboard')}})}tr.append(td)});body.append(tr)});
 if(!rows.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=args.columns.length;td.className='empty';td.textContent='선택 조건을 충족하는 데이터가 없습니다.';tr.append(td);body.append(tr)}
 document.querySelector('#count').textContent=rows.length+' / '+args.rows.length+'개';send('streamlit:setFrameHeight',{height:Math.min(570,document.body.scrollHeight+3)});
}
window.addEventListener('message',event=>{if(event.source!==parent||event.data.type!=='streamlit:render')return;args=event.data.args;try{const old=JSON.parse(sessionStorage.getItem('flow-ui:'+args.storage_key)||'{}');sort=old.sort||null;selected=old.selected||null;document.querySelector('input').value=old.filter||''}catch{}draw()});document.querySelector('input').oninput=()=>{save();draw()};new ResizeObserver(()=>send('streamlit:setFrameHeight',{height:Math.min(570,document.body.scrollHeight+3)})).observe(document.body);send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
